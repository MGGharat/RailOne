# Render Blueprint Specification for RailOne
# Free/demo deployment configuration

services:

  # RailOne FastAPI Backend
  - type: web
    name: railone-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railone-postgres
          property: connectionString

      - key: REDIS_ENABLED
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: '["https://railone-ten.vercel.app","https://railone-lilac.vercel.app","http://localhost:5173","http://127.0.0.1:5173"]'

databases:

  # RailOne PostgreSQL Database
  - name: railone-postgres
    databaseName: railone_db
    user: rail_user
    plan: free